<VirtualHost *:80>
    # Serve from webroot/ so that src/, config/ and vendor/ are never reachable
    # over HTTP, even if the rewrite rules are misconfigured.
    DocumentRoot /var/www/html/webroot

    <Directory /var/www/html/webroot>
        # CakePHP ships routing rules in webroot/.htaccess; AllowOverride All
        # is required for mod_rewrite to pick them up.
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
